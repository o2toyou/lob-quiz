<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Language of Breath 修了テスト（日本語版）</title>
<style>
  :root{
    --navy:#1f3a5f; --teal:#5fb3b0; --gold:#daa520;
    --bg:#f7f9f9; --card:#ffffff; --line:#e4ebeb; --ink:#2b3338; --muted:#7c8a90;
    --ok-bg:#eef7f6; --ok-line:#5fb3b0; --ng-bg:#fbeeee; --ng-line:#c9584f;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    line-height:1.75; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:32px 20px 120px}
  header{text-align:center;margin-bottom:24px}
  header h1{font-size:26px;color:var(--navy);margin:0 0 4px;letter-spacing:.02em}
  header .sub{font-size:19px;color:var(--teal);font-weight:700;margin-bottom:10px}
  header .meta{font-size:13px;color:var(--muted)}
  .rule{height:3px;width:64px;background:var(--gold);margin:16px auto 0;border-radius:2px}

  .intake{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 6px;margin:14px 0}
  .intake label{display:block;font-size:13px;font-weight:700;color:var(--navy);margin:2px 0 6px}
  .intake input{
    width:100%;font-family:inherit;font-size:15px;padding:10px 12px;margin-bottom:14px;
    border:1.5px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);
  }
  .intake input:focus{outline:none;border-color:var(--teal)}

  .progress{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 10px;margin-bottom:8px;border-bottom:1px solid var(--line)}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:var(--teal);transition:width .3s ease}
  .pcount{font-size:12px;color:var(--muted);margin-top:6px;text-align:right}

  .q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 20px 16px;margin:14px 0;box-shadow:0 1px 2px rgba(31,58,95,.04)}
  .q .num{color:var(--teal);font-weight:800;font-size:14px;letter-spacing:.04em}
  .q .text{font-weight:700;color:var(--navy);font-size:16.5px;margin:4px 0 14px}
  .opt{display:flex;align-items:flex-start;gap:10px;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;margin:8px 0;cursor:pointer;transition:border-color .15s,background .15s;background:#fff}
  .opt:hover{border-color:var(--teal)}
  .opt .mk{flex:0 0 24px;height:24px;border-radius:50%;border:1.5px solid #c3ced2;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#7f8c92;margin-top:1px}
  .opt .lbl{font-size:15px;color:var(--ink)}
  .opt.sel{border-color:var(--teal);background:#f2faf9}
  .opt.sel .mk{background:var(--teal);border-color:var(--teal);color:#fff}
  .graded .opt{cursor:default}
  .graded .opt.correct{border-color:var(--ok-line);background:var(--ok-bg)}
  .graded .opt.correct .mk{background:var(--ok-line);border-color:var(--ok-line);color:#fff}
  .graded .opt.wrong{border-color:var(--ng-line);background:var(--ng-bg)}
  .graded .opt.wrong .mk{background:var(--ng-line);border-color:var(--ng-line);color:#fff}
  .tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:20px;margin-left:8px;vertical-align:middle}
  .tag.ok{background:var(--ok-line);color:#fff}
  .tag.ng{background:var(--ng-line);color:#fff}

  .actionbar{position:fixed;left:0;right:0;bottom:0;background:rgba(247,249,249,.94);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:12px 20px;display:flex;justify-content:center;gap:12px}
  button{font-family:inherit;font-size:15px;font-weight:700;border:none;border-radius:10px;padding:12px 26px;cursor:pointer;transition:opacity .15s,transform .05s}
  button:active{transform:translateY(1px)}
  .btn-primary{background:var(--navy);color:#fff}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed}
  .btn-ghost{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}

  .result{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 24px;margin:14px 0;text-align:center}
  .result .score{font-size:44px;font-weight:800;line-height:1.1;margin:6px 0}
  .result .pct{font-size:16px;color:var(--muted)}
  .result .verdict{font-size:22px;font-weight:800;margin:14px 0 6px}
  .result .verdict.pass{color:var(--teal)}
  .result .verdict.fail{color:var(--ng-line)}
  .result .note{font-size:13px;color:var(--muted)}
  .sendstate{font-size:12px;margin-top:12px;color:var(--muted)}
  .err{color:var(--ng-line)}

  .history{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:14px 0}
  .history h2{font-size:14px;color:var(--navy);margin:0 0 8px}
  .history ul{margin:0;padding-left:0;list-style:none}
  .history li{font-size:13px;color:var(--ink);padding:4px 0;border-bottom:1px dashed var(--line)}
  .history li:last-child{border-bottom:none}
  .history .h-pass{color:var(--teal);font-weight:700}
  .history .h-fail{color:var(--ng-line);font-weight:700}
  .history .h-note{font-size:11px;color:var(--muted);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>The Language of Breath</h1>
    <div class="sub">修了テスト（日本語版）</div>
    <div class="meta">全30問　|　合格ライン 70%以上（21問以上正解）　|　単一選択</div>
    <div class="rule"></div>
  </header>

  <div id="historyBox"></div>

  <div class="intake">
    <label for="nm">お名前 <span style="color:var(--ng-line)">*</span></label>
    <input id="nm" type="text" placeholder="山田 花子" autocomplete="name">
    <label for="em">メールアドレス <span style="color:var(--ng-line)">*</span></label>
    <input id="em" type="email" placeholder="you@example.com" autocomplete="email">
  </div>

  <div class="progress">
    <div class="bar"><i id="barFill"></i></div>
    <div class="pcount"><span id="answered">0</span> / 30 問 回答済み</div>
  </div>

  <div id="quiz"></div>
  <div id="resultBox"></div>
</div>

<div class="actionbar" id="actionbar">
  <button class="btn-primary" id="submitBtn" disabled>採点して送信</button>
</div>

<script>
// ===== 設定：Formspree のエンドポイントをここに貼り付けてください =====
// 例: https://formspree.io/f/xxxxxxxx
const FORMSPREE_ENDPOINT = "https://formspree.io/f/xjybbpzb";
// =====================================================================

const LETTERS=['A','B','C','D'];
const DATA = [{"n": 1, "q": "The Language of Breath の哲学において、すべての前向きな変化の土台となるものは何か？", "opts": [{"t": "モチベーション", "c": false}, {"t": "アウェアネス（気づき）", "c": true}, {"t": "規律", "c": false}, {"t": "テクニック", "c": false}]}, {"n": 2, "q": "The Language of Breath では、人間という有機体全体を「心と身体」だけでなく一つの関係性として捉える。この全体を指す言葉は何か？", "opts": [{"t": "ソーマ（Soma）", "c": false}, {"t": "フィリア（Philia）", "c": true}, {"t": "プシュケー（Psyche）", "c": false}, {"t": "アニムス（Animus）", "c": false}]}, {"n": 3, "q": "低酸素症（ハイポキシア）とは何か？", "opts": [{"t": "身体の組織における酸素が低下した状態", "c": true}, {"t": "血中の二酸化炭素が高い状態", "c": false}, {"t": "速い呼吸の一種", "c": false}, {"t": "血圧が高い状態", "c": false}]}, {"n": 4, "q": "低炭酸ガス血症（ハイポカプニア）とは何か？", "opts": [{"t": "血中の二酸化炭素が減少した状態", "c": true}, {"t": "血中の酸素が低い状態", "c": false}, {"t": "血中の二酸化炭素が高い状態", "c": false}, {"t": "遅い呼吸の一種", "c": false}]}, {"n": 5, "q": "高炭酸ガス血症（ハイパーカプニア）とは何か？", "opts": [{"t": "血中の二酸化炭素が異常に高い状態", "c": true}, {"t": "血中の酸素が低い状態", "c": false}, {"t": "速い呼吸の状態", "c": false}, {"t": "血糖値が高い状態", "c": false}]}, {"n": 6, "q": "低酸素誘発性の一過性前頭葉機能低下（hypoxia-induced transient hypofrontality）とは何か？", "opts": [{"t": "低酸素によって引き起こされる前頭前皮質の活動の一時的な低下", "c": true}, {"t": "前頭葉機能の永続的な喪失", "c": false}, {"t": "血中の二酸化炭素が高い状態", "c": false}, {"t": "筋疲労の一種", "c": false}]}, {"n": 7, "q": "次のうち、The Language of Breath の「5つの基本理念（Five Tenets）」に含まれないものはどれか？", "opts": [{"t": "アウェアネスはすべての前向きな変化の土台である", "c": false}, {"t": "あなたの無意識の自己は、常にあなたを助けようとしている", "c": false}, {"t": "ブレスワークはあなたのすべての問題を解決する", "c": true}, {"t": "行動こそが言葉である", "c": false}]}, {"n": 8, "q": "アウェアネス・エクササイズ（Awareness Exercise）を通じて主に育まれるスキルは何か？", "opts": [{"t": "身体的な筋力", "c": false}, {"t": "内的なアウェアネス（内面への気づき）", "c": true}, {"t": "柔軟性", "c": false}, {"t": "記憶力", "c": false}]}, {"n": 9, "q": "アドバンスド・アウェアネス・エクササイズ（Advanced Awareness Exercise）を実践する際の主な目的は何か？", "opts": [{"t": "呼吸の速度を上げること", "c": false}, {"t": "意識的な思考が内的状態にどう影響するかを観察すること", "c": true}, {"t": "できるだけ長く息を止めること", "c": false}, {"t": "感情を無視すること", "c": false}]}, {"n": 10, "q": "The Language of Breath の哲学は、感情をどのようなものと捉えているか？", "opts": [{"t": "ブレスワークとは無関係なもの", "c": false}, {"t": "行動や振る舞いを促すために、無意識から発せられる生物学的なシグナル", "c": true}, {"t": "どこか遠い世界から届くメッセージ", "c": false}, {"t": "意識的にコントロールできるもの", "c": false}]}, {"n": 11, "q": "リスニング・エクササイズ（Listening Exercise）の目的は何か？", "opts": [{"t": "感情から気をそらすこと", "c": false}, {"t": "感情と安全につながり、それを処理すること", "c": true}, {"t": "ストレスを高めること", "c": false}, {"t": "速い呼吸を練習すること", "c": false}]}, {"n": 12, "q": "The Language of Breath によれば、人にとって最も健全な状態とはどのような状態か？", "opts": [{"t": "意識的な自己が支配している状態", "c": false}, {"t": "無意識の自己が無視されている状態", "c": false}, {"t": "全体としての自己（フィリア）がチームとして機能している状態", "c": true}, {"t": "感情が抑圧されている状態", "c": false}]}, {"n": 13, "q": "The Language of Breath における「フィリア（philia）」という語が指すものは何か？", "opts": [{"t": "呼吸法の一種", "c": false}, {"t": "自分自身の内側にある慈しみに満ちた関係性", "c": true}, {"t": "瞑想の一種", "c": false}, {"t": "あっさりしたチキングレイビー", "c": false}]}, {"n": 14, "q": "ブレスワークにおける自律神経系の役割は何か？", "opts": [{"t": "無関係である", "c": false}, {"t": "無意識に調整されているが、意識的な呼吸によって影響を与えることができる", "c": true}, {"t": "消化のみを司る", "c": false}, {"t": "常に意識的なコントロール下にある", "c": false}]}, {"n": 15, "q": "呼吸の際、ガス交換が最も効率よく行われる肺の領域はどこか？", "opts": [{"t": "上部胸郭", "c": false}, {"t": "口", "c": false}, {"t": "下葉（肺の下部）", "c": true}, {"t": "中間領域", "c": false}]}, {"n": 16, "q": "機能的な呼吸において、吸気を主に開始する筋肉はどれか？", "opts": [{"t": "腹筋", "c": false}, {"t": "横隔膜", "c": true}, {"t": "大胸筋", "c": false}, {"t": "僧帽筋", "c": false}]}, {"n": 17, "q": "完全な吸気における、活性化の正しい順序はどれか？", "opts": [{"t": "胸 → 肋骨 → お腹", "c": false}, {"t": "お腹 → 肋骨 → 胸", "c": true}, {"t": "肋骨 → 胸 → お腹", "c": false}, {"t": "胸 → お腹 → 肋骨", "c": false}]}, {"n": 18, "q": "呼吸における肋間筋の主な機能は何か？", "opts": [{"t": "腰部を広げること", "c": false}, {"t": "吸気と呼気の際に肋骨を動かすこと", "c": true}, {"t": "横隔膜を収縮させること", "c": false}, {"t": "心拍数を上げること", "c": false}]}, {"n": 19, "q": "胸のみの呼吸が、ガス交換において効率が悪いとされるのはなぜか？", "opts": [{"t": "上部胸郭は血管が少ないから", "c": false}, {"t": "上部胸郭は睡眠中にのみ使われるから", "c": false}, {"t": "上葉は表面積が小さく、ガス交換のための血流も乏しいから", "c": true}, {"t": "胸の筋肉は横隔膜より弱いから", "c": false}]}, {"n": 20, "q": "ゆっくりとした低い（腹式の）呼吸は、無意識の自己に何を伝えるか？", "opts": [{"t": "危険", "c": false}, {"t": "落ち着きとリラックス", "c": true}, {"t": "身体的な運動", "c": false}, {"t": "興奮", "c": false}]}, {"n": 21, "q": "レゾナンス・フリークエンシー・ブリージング（共鳴周波数呼吸：毎分約6呼吸）を実践することの生理学的なメリットは何か？", "opts": [{"t": "血圧を上げる", "c": false}, {"t": "心拍変動（HRV）と気分を改善する", "c": true}, {"t": "過呼吸を引き起こす", "c": false}, {"t": "血糖値を上げる", "c": false}]}, {"n": 22, "q": "バランス呼吸において、吸気時と呼気時に心拍数はどうなるか？", "opts": [{"t": "心拍数は変わらない", "c": false}, {"t": "吸気時に心拍数が上がり、呼気時に下がる", "c": true}, {"t": "吸気時に心拍数が下がり、呼気時に上がる", "c": false}, {"t": "心拍数は呼吸の影響を受けない", "c": false}]}, {"n": 23, "q": "アウェアネス・エクササイズにおける「中立的な肺（neutral lung）での無呼吸（pause）」の目的は何か？", "opts": [{"t": "酸素の取り込みを増やすため", "c": false}, {"t": "内的なアウェアネスを育み、内側の感覚を観察するため", "c": true}, {"t": "胸の筋肉を強化するため", "c": false}, {"t": "呼吸を速めるため", "c": false}]}, {"n": 24, "q": "ブレスワークの表記における「アプニア（apnea）」とは何を意味するか？", "opts": [{"t": "素早い吸気", "c": false}, {"t": "息止め（ブレスホールド）", "c": true}, {"t": "力強い呼気", "c": false}, {"t": "ため息", "c": false}]}, {"n": 25, "q": "吸う・止める・吐く・止めるを 4-4-4-4 の比率で行う呼吸法はどれか？", "opts": [{"t": "ボックス・ブリージング", "c": true}, {"t": "バランス・ブリージング", "c": false}, {"t": "ストロー・ブリージング", "c": false}, {"t": "トライアングル・ブリージング", "c": false}]}, {"n": 26, "q": "呼吸における鼻の主要な機能の一つは何か？", "opts": [{"t": "気流の速度を上げる", "c": false}, {"t": "肺に届く前の空気を、ろ過し・温め・加湿する", "c": true}, {"t": "酸素の取り込みを減らす", "c": false}, {"t": "吸収しやすいように空気を乾燥させる", "c": false}]}, {"n": 27, "q": "鼻呼吸は口呼吸と比べて酸素の吸収にどのような影響を与えるか？", "opts": [{"t": "酸素の吸収を低下させる", "c": false}, {"t": "酸素の吸収には影響しない", "c": false}, {"t": "酸素の吸収を10〜20%増加させる", "c": true}, {"t": "酸素の吸収を予測不能にする", "c": false}]}, {"n": 28, "q": "鼻腔内で産生され、鼻呼吸の際に吸い込まれることで気道を弛緩・拡張させるのに役立つ分子はどれか？", "opts": [{"t": "二酸化炭素", "c": false}, {"t": "一酸化窒素（NO）", "c": true}, {"t": "酸素", "c": false}, {"t": "過酸化水素", "c": false}]}, {"n": 29, "q": "イントロセプション（interoception／内受容感覚）とは何か？", "opts": [{"t": "外部の音や光景への気づき", "c": false}, {"t": "身体内部の感覚を感じ取り、自分の内側の状態に気づく感覚", "c": true}, {"t": "呼吸を随意にコントロールする能力", "c": false}, {"t": "食物を消化する過程", "c": false}]}, {"n": 30, "q": "CO₂耐性トレーニングにおいて「エッジ（edge）を見つける」とはどういう意味か？", "opts": [{"t": "心拍数を上げるためにできるだけ速く呼吸すること", "c": false}, {"t": "息を求めてあえぐ地点まで自分を追い込むこと", "c": false}, {"t": "軽い呼吸衝動を感じるまで呼吸量をやさしく減らし、不快感に圧倒されることなく空気飢餓感のちょうど手前の状態に留まること", "c": true}, {"t": "吐かずにできるだけ長く息を止めること", "c": false}]}];

const quizEl=document.getElementById('quiz');
const answers={};

// ===== 受験履歴（この端末のブラウザに保存） =====
const STORE_KEY='lob_quiz_history';
function loadHistory(){try{return JSON.parse(localStorage.getItem(STORE_KEY))||[]}catch(e){return[]}}
function saveHistory(entry){
  try{
    const h=loadHistory(); h.push(entry);
    localStorage.setItem(STORE_KEY,JSON.stringify(h.slice(-20)));
  }catch(e){}
}
function renderHistory(){
  const h=loadHistory(); const box=document.getElementById('historyBox');
  if(!h.length){box.innerHTML='';return;}
  const rows=h.slice().reverse().map(e=>
    '<li>'+escapeHtml(e.date)+'　'+e.correct+' / '+e.total+'（'+e.pct+'%）　'
    +'<span class="'+(e.pass?'h-pass':'h-fail')+'">'+(e.pass?'合格':'不合格')+'</span></li>').join('');
  box.innerHTML='<div class="history"><h2>受験履歴</h2><ul>'+rows+'</ul>'
    +'<div class="h-note">※ この端末のブラウザに保存された記録です（最新20件）</div></div>';
  const last=h[h.length-1];
  if(last.name&&!document.getElementById('nm').value)document.getElementById('nm').value=last.name;
  if(last.email&&!document.getElementById('em').value)document.getElementById('em').value=last.email;
  refreshBtn();
}

function render(){
  DATA.forEach(item=>{
    const q=document.createElement('div');
    q.className='q'; q.id='q'+item.n;
    q.innerHTML='<div class="num">Q'+item.n+'</div><div class="text">'+escapeHtml(item.q)+'</div>';
    item.opts.forEach((opt,i)=>{
      const o=document.createElement('div');
      o.className='opt'; o.dataset.n=item.n; o.dataset.i=i;
      o.innerHTML='<span class="mk">'+LETTERS[i]+'</span><span class="lbl">'+escapeHtml(opt.t)+'</span>';
      o.addEventListener('click',()=>select(item.n,i));
      q.appendChild(o);
    });
    quizEl.appendChild(q);
  });
}
function select(n,i){
  if(document.getElementById('q'+n).classList.contains('graded'))return;
  answers[n]=i;
  const qEl=document.getElementById('q'+n);
  [...qEl.querySelectorAll('.opt')].forEach(o=>o.classList.toggle('sel',+o.dataset.i===i));
  updateProgress();
}
function updateProgress(){
  const c=Object.keys(answers).length;
  document.getElementById('answered').textContent=c;
  document.getElementById('barFill').style.width=(c/DATA.length*100)+'%';
  refreshBtn();
}
function refreshBtn(){
  const done=Object.keys(answers).length===DATA.length;
  const nm=document.getElementById('nm').value.trim();
  const em=document.getElementById('em').value.trim();
  document.getElementById('submitBtn').disabled=!(done&&nm&&em);
}
document.getElementById('nm').addEventListener('input',refreshBtn);
document.getElementById('em').addEventListener('input',refreshBtn);

function grade(){
  let correct=0; const detail=[]; const marks=[];
  DATA.forEach(item=>{
    const chosen=answers[item.n];
    const correctIdx=item.opts.findIndex(o=>o.c);
    const isRight=chosen===correctIdx;
    if(isRight)correct++;
    detail.push('Q'+item.n+': '+(isRight?'正':'誤')+' / 回答: '+item.opts[chosen].t);
    marks.push({n:item.n,chosen,correctIdx,isRight});
  });
  const pass=Math.round(correct/DATA.length*100)>=70;
  marks.forEach(m=>{
    const qEl=document.getElementById('q'+m.n);
    qEl.classList.add('graded');
    [...qEl.querySelectorAll('.opt')].forEach(o=>{
      o.classList.remove('sel');
      const idx=+o.dataset.i;
      if(pass){
        // 合格時のみ正解を開示する
        if(idx===m.correctIdx){o.classList.add('correct');o.querySelector('.lbl').insertAdjacentHTML('beforeend','<span class="tag ok">正解</span>');}
        else if(idx===m.chosen){o.classList.add('wrong');o.querySelector('.lbl').insertAdjacentHTML('beforeend','<span class="tag ng">あなたの回答</span>');}
      }else{
        if(idx!==m.chosen)return;
        if(m.isRight){o.classList.add('correct');o.querySelector('.lbl').insertAdjacentHTML('beforeend','<span class="tag ok">正解</span>');}
        else{o.classList.add('wrong');o.querySelector('.lbl').insertAdjacentHTML('beforeend','<span class="tag ng">不正解</span>');}
      }
    });
  });
  showResult(correct,detail);
}
function showResult(correct,detail){
  const total=DATA.length, pct=Math.round(correct/total*100), pass=pct>=70;
  const box=document.getElementById('resultBox');
  box.innerHTML='<div class="result">'
    +'<div class="pct">スコア</div>'
    +'<div class="score" style="color:'+(pass?'var(--teal)':'var(--ng-line)')+'">'+correct+'<span style="font-size:22px;color:var(--muted)"> / '+total+'</span></div>'
    +'<div class="pct">'+pct+'%</div>'
    +'<div class="verdict '+(pass?'pass':'fail')+'">'+(pass?'合格です':'あと一歩')+'</div>'
    +'<div class="note">'+(pass?'おめでとうございます。合格ラインを超えました。':'合格ラインは70%（21問）です。赤く表示された問題を復習して、もう一度挑戦しましょう。（正解は合格時に表示されます）')+'</div>'
    +'<div class="sendstate" id="sendstate">結果を送信しています…</div>'
    +'</div>';
  box.scrollIntoView({behavior:'smooth',block:'center'});
  saveHistory({
    date:new Date().toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}),
    name:document.getElementById('nm').value.trim(),
    email:document.getElementById('em').value.trim(),
    correct,total,pct,pass
  });
  document.getElementById('actionbar').innerHTML='<button class="btn-ghost" id="retakeBtn">もう一度受ける</button>';
  document.getElementById('retakeBtn').addEventListener('click',()=>location.reload());
  sendResult(correct,total,pct,pass,detail);
}
function sendResult(correct,total,pct,pass,detail){
  const st=document.getElementById('sendstate');
  const nm=document.getElementById('nm').value.trim();
  const em=document.getElementById('em').value.trim();
  if(!FORMSPREE_ENDPOINT||FORMSPREE_ENDPOINT.indexOf('YOUR_FORM_ID')>=0){
    st.className='sendstate err';
    st.textContent='※ 送信先が未設定です（管理者へ連絡してください）';
    return;
  }
  const scoreLine=correct+' / '+total+'（'+pct+'%）';
  const verdictLine=pass?'合格':'不合格（合格ライン70%）';
  const autoBody=pass
    ? 'The Language of Breath 修了テストを受験いただきありがとうございました。\n\n結果: '+scoreLine+'\n判定: 合格\n\nおめでとうございます。合格ラインを超えました。\n\n※ 各問題の正解・不正解はテスト画面でご確認いただけます。'
    : 'The Language of Breath 修了テストを受験いただきありがとうございました。\n\n結果: '+scoreLine+'\n判定: 不合格（合格ライン70%）\n\n今回は合格ラインに届きませんでした。テスト画面で赤く表示された問題を復習のうえ、もう一度挑戦してください。\n（正解は合格時にのみ画面に表示される仕様のため、このメールには記載していません）';
  const payload={
    _subject:'[LoB修了テスト] '+nm+' さん（'+correct+'/'+total+'・'+(pass?'合格':'不合格')+'）',
    _replyto:em,
    _autoresponse:autoBody,
    お名前:nm, メールアドレス:em,
    スコア:scoreLine,
    合否:verdictLine,
    詳細:detail.join('\n')
  };
  fetch(FORMSPREE_ENDPOINT,{method:'POST',headers:{'Accept':'application/json','Content-Type':'application/json'},body:JSON.stringify(payload)})
    .then(r=>{ if(r.ok){st.textContent='✓ 結果を送信しました。ご入力いただいたメールアドレスにも控えをお送りしました。';}
      else{st.className='sendstate err';st.textContent='※ 送信に失敗しました。スクリーンショットをご送付ください。';} })
    .catch(()=>{ st.className='sendstate err';st.textContent='※ 送信に失敗しました。スクリーンショットをご送付ください。'; });
}
function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

document.getElementById('submitBtn').addEventListener('click',grade);
render(); updateProgress(); renderHistory();
</script>
